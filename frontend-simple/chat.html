<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat - TrendIntel</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .chat-wrapper {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 70px);
            max-width: 800px;
            margin: 0 auto;
            padding: 1rem 20px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            padding: 1rem 0;
        }

        .chat-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            gap: 1rem;
            color: #a1a1aa;
        }

        .chat-empty h2 {
            color: #fbbf24;
            font-size: 1.5rem;
        }

        .suggestions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-top: 1rem;
            width: 100%;
        }

        .suggestion-btn {
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: #a1a1aa;
            font-size: 0.9rem;
            cursor: pointer;
            text-align: left;
            transition: border-color 0.2s, color 0.2s;
        }

        .suggestion-btn:hover {
            border-color: #fbbf24;
            color: #e4e4e7;
        }

        .message {
            display: flex;
            gap: 0.75rem;
            align-items: flex-start;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
            border: 1px solid #27272a;
            background: #18181b;
        }

        .message.user .message-icon {
            background: #27272a;
        }

        .message.assistant .message-icon {
            border-color: #fbbf2440;
            background: #fbbf2410;
        }

        .message-content {
            max-width: 80%;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 12px;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #e4e4e7;
            white-space: pre-wrap;
        }

        .message.user .message-content {
            background: #27272a;
        }

        .message-content.error {
            border-color: #ef444440;
            background: #ef44440d;
            color: #ef4444;
        }

        .thinking {
            color: #a1a1aa;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding-left: 44px;
        }

        .dot-animation span {
            animation: blink 1.4s infinite;
            font-size: 1.2rem;
        }

        .dot-animation span:nth-child(2) { animation-delay: 0.2s; }
        .dot-animation span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0; }
            40% { opacity: 1; }
        }

        .chat-input-bar {
            border-top: 1px solid #27272a;
            padding: 1rem 0;
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .chat-input {
            flex: 1;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: #e4e4e7;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: #fbbf24;
        }

        .send-btn {
            background: #fbbf24;
            color: #0a0a0b;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.25rem;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .send-btn:hover:not(:disabled) {
            opacity: 0.85;
        }

        @media (max-width: 768px) {
            .suggestions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1 class="logo">📊 TrendIntel</h1>
            <ul class="nav-links">
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="repos.html">GitHub Repos</a></li>
                <li><a href="hn.html">Hacker News</a></li>
                <li><a href="articles.html">DEV Articles</a></li>
                <li><a href="chat.html" class="active">AI Chat</a></li>
            </ul>
        </div>
    </nav>

    <div class="chat-wrapper">
        <div class="chat-messages" id="chatMessages">
            <div class="chat-empty" id="emptyState">
                <div style="font-size: 2rem;">✨</div>
                <h2>Trend Intelligence AI</h2>
                <p>Ask anything about trending repos, Hacker News, DEV.to articles and emerging developer topics.</p>
                <div class="suggestions">
                    <button class="suggestion-btn" onclick="sendMessage('What are the hottest repos right now?')">What are the hottest repos right now?</button>
                    <button class="suggestion-btn" onclick="sendMessage('Summarize the top developer trends this week.')">Summarize the top developer trends this week.</button>
                    <button class="suggestion-btn" onclick="sendMessage('Which programming languages are gaining momentum?')">Which programming languages are gaining momentum?</button>
                    <button class="suggestion-btn" onclick="sendMessage('What topics are emerging across HN and DEV.to?')">What topics are emerging across HN and DEV.to?</button>
                </div>
            </div>
        </div>

        <div class="chat-input-bar">
            <input
                type="text"
                id="chatInput"
                class="chat-input"
                placeholder="Ask about developer trends..."
                onkeydown="if(event.key === 'Enter') sendMessage()"
            />
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        async function sendMessage(text) {
            const input = document.getElementById('chatInput');
            const query = text || input.value.trim();
            if (!query) return;

            input.value = '';
            document.getElementById('sendBtn').disabled = true;

            // Hide empty state
            document.getElementById('emptyState').style.display = 'none';

            const messages = document.getElementById('chatMessages');

            // Add user message
            messages.innerHTML += `
                <div class="message user">
                    <div class="message-icon">👤</div>
                    <div class="message-content">${query}</div>
                </div>
            `;

            // Add thinking indicator
            const thinkingId = 'thinking-' + Date.now();
            messages.innerHTML += `
                <div class="thinking" id="${thinkingId}">
                    <div class="dot-animation"><span>●</span><span>●</span><span>●</span></div>
                    analyzing trend data...
                </div>
            `;
            messages.scrollTop = messages.scrollHeight;

            try {
                const res = await fetch(`${API_BASE}/api/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });

                const data = await res.json();
                document.getElementById(thinkingId).remove();

                if (!res.ok) {
                    throw new Error(data.detail || 'Something went wrong');
                }

                messages.innerHTML += `
                    <div class="message assistant">
                        <div class="message-icon">✨</div>
                        <div class="message-content">${data.analysis}</div>
                    </div>
                `;
            } catch (err) {
                document.getElementById(thinkingId).remove();
                messages.innerHTML += `
                    <div class="message assistant">
                        <div class="message-icon">✨</div>
                        <div class="message-content error">${err.message}</div>
                    </div>
                `;
            }

            document.getElementById('sendBtn').disabled = false;
            messages.scrollTop = messages.scrollHeight;
            document.getElementById('chatInput').focus();
        }
    </script>
</body>
</html>
